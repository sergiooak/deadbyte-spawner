# Stack do DeadByte com banco externo: painel/spawner + rembg, usando um PostgreSQL que já existe (DATABASE_URL).
# Na Coolify: New Resource → Docker Compose (build pack "Docker Compose") apontando para este repo.
# As variáveis SERVICE_* são geradas pela Coolify automaticamente.
# Para subir um PostgreSQL próprio junto, use docker-compose.postgres.yml.

services:
  spawner:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_SPAWNER_3000
      # Banco existente, ex.: postgres://deadbyte_spawner:SENHA@<host interno>:5432/deadbyte_spawner
      - DATABASE_URL=${DATABASE_URL:?}
      - DEADBYTE_ADMIN_PASSWORD=${SERVICE_PASSWORD_64_ADMIN}
      # Token só leitura da API de logs (/api/logs), para revisões automáticas.
      - DEADBYTE_LOGS_TOKEN=${SERVICE_PASSWORD_64_LOGS}
      - DEADBYTE_BOT_DEFAULT_REPOSITORY_URL=${DEADBYTE_BOT_DEFAULT_REPOSITORY_URL:-https://github.com/sergiooak/deadbyte-bot.git}
      - DEADBYTE_BOT_DEFAULT_BRANCH=${DEADBYTE_BOT_DEFAULT_BRANCH:-main}
      - DEADBYTE_REMBG_URL=http://rembg:7000
      - DEADBYTE_LOG_RETENTION_DAYS=${DEADBYTE_LOG_RETENTION_DAYS:-180}
      # Ao conectar, o bot responde o que chegou com ele desligado (off desliga). Fuso usado no "pendentes de hoje".
      - DEADBYTE_CATCHUP=${DEADBYTE_CATCHUP:-on}
      - DEADBYTE_TIMEZONE=${DEADBYTE_TIMEZONE:-America/Sao_Paulo}
      - DEADBYTE_TEXAS_API_KEY=${DEADBYTE_TEXAS_API_KEY:-}
      - DEADBYTE_TTP_API_KEY=${DEADBYTE_TTP_API_KEY:-}
      - DEADBYTE_TYPESAFE_API_KEY=${DEADBYTE_TYPESAFE_API_KEY:-}
      - DEADBYTE_OPENAI_API_KEY=${DEADBYTE_OPENAI_API_KEY:-}
    volumes:
      # Repos clonados, sessões do WhatsApp e configs das instâncias. Não apague.
      - deadbyte-data:/data
    # Chromium precisa de /dev/shm maior que o padrão de 64MB.
    shm_size: 1gb
    # Tempo para os bots fecharem o Chromium e gravarem a sessão no volume antes do container sair.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Remoção de fundo do comando .bg. Opcional: pode remover se não usar (economiza ~1GB de RAM).
  rembg:
    image: danielgatis/rembg:latest
    restart: unless-stopped
    command: ["s", "--host", "0.0.0.0", "--port", "7000"]
    volumes:
      - deadbyte-rembg-models:/root/.u2net

volumes:
  deadbyte-data:
  deadbyte-rembg-models:
